name: Check regulation updates

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check official IPS documents
        id: check
        continue-on-error: true
        run: python scripts/import_regulations.py check --report docs/regulation/change-reports/latest.md

      - name: Import changed documents
        if: steps.check.outcome == 'failure'
        run: python scripts/import_regulations.py import

      - name: Commit update report and imported documents
        if: steps.check.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/regulation_state.json
          git commit -m "Update regulation documents"
          git push
